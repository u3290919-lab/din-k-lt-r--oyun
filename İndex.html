<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilgi Muhafızı: Savaş Alanı</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Courier New', Courier, monospace; background: #222; touch-action: none; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.8); padding: 15px; border-radius: 5px; border-left: 5px solid #e74c3c; pointer-events: none; z-index: 50; }
        .stat { font-size: 18px; font-weight: bold; text-shadow: 1px 1px #000; }

        .ctrl-btn { position: absolute; border-radius: 50%; border: 3px solid rgba(255,255,255,0.4); color: white; font-weight: bold; z-index: 60; display: flex; align-items: center; justify-content: center; user-select: none; }
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(0,0,0,0.3); border-radius: 50%; border: 2px dashed rgba(255,255,255,0.5); }
        #joy-stick { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.6); border-radius: 50%; top: 35px; left: 35px; }
        
        #btn-shoot { bottom: 50px; right: 150px; width: 100px; height: 100px; background: rgba(231, 76, 60, 0.7); font-size: 16px; }
        #btn-reload { bottom: 60px; right: 40px; width: 80px; height: 80px; background: rgba(241, 196, 15, 0.7); color: #000; font-size: 14px; }

        #quiz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; text-align: center; }
        .q-opt { background: #444; color: white; border: 2px solid #fff; padding: 18px; margin: 10px; width: 85%; max-width: 450px; border-radius: 10px; font-size: 20px; font-weight: bold; }
        
        #start-screen { position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .start-btn { padding: 20px 50px; font-size: 24px; background: #2ecc71; border: none; color: white; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1>BİLGİ MUHAFIZI</h1>
        <p>Savaş alanına girmek için butona bas!</p>
        <button class="start-btn" onclick="startGame()">SAVAŞI BAŞLAT</button>
    </div>

    <div id="ui">
        <div class="stat">ŞARJÖR: <span id="ammo">30 / 30</span></div>
        <div class="stat" id="status" style="color:#e74c3c">OPERASYON BAŞLADI</div>
    </div>

    <div id="joy-base"><div id="joy-stick"></div></div>
    <button class="ctrl-btn" id="btn-shoot">ATEŞ</button>
    <button class="ctrl-btn" id="btn-reload">DOLDUR</button>

    <div id="quiz">
        <h2 style="color: #f1c40f;">KRİTİK HATA: SİSTEM KİLİTLENDİ</h2>
        <h3 id="q-text">Soru Yükleniyor...</h3>
        <div id="q-options" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width/2, y: canvas.height/2, r: 22, angle: 0, speed: 2.8 }; // Hız düşürüldü
        let bullets = [], enemies = [];
        let ammo = 30, maxAmmo = 30, isDead = false, isShooting = false;
        let moveX = 0, moveY = 0;
        let shootTimer = 0;

        // Arka plan deseni oluşturma (Savaş Alanı Dokusu)
        function drawBackground() {
            ctx.fillStyle = '#3e4a36'; // Toprak/Çimen rengi
            ctx.fillRect(0,0, canvas.width, canvas.height);
            
            ctx.strokeStyle = 'rgba(0,0,0,0.1)';
            for(let i=0; i<canvas.width; i+=50) {
                ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke();
            }
            for(let j=0; j<canvas.height; j+=50) {
                ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width, j); ctx.stroke();
            }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('bgMusic').play();
            gameLoop();
        }

        // Joystick
        const joyBase = document.getElementById('joy-base');
        const joyStick = document.getElementById('joy-stick');
        joyBase.addEventListener('touchmove', (e) => {
            if(isDead) return;
            const touch = e.touches[0];
            const rect = joyBase.getBoundingClientRect();
            const dx = touch.clientX - (rect.left + 65);
            const dy = touch.clientY - (rect.top + 65);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50);
            const angle = Math.atan2(dy, dx);
            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = Math.cos(angle) * (dist / 50);
            moveY = Math.sin(angle) * (dist / 50);
            player.angle = angle;
        });
        joyBase.addEventListener('touchend', () => { 
            joyStick.style.transform = 'translate(0,0)'; 
            moveX = 0; moveY = 0; 
        });

        // Çoklu Ateş Mekanizması
        const shootBtn = document.getElementById('btn-shoot');
        shootBtn.addEventListener('touchstart', () => { isShooting = true; });
        shootBtn.addEventListener('touchend', () => { isShooting = false; });

        document.getElementById('btn-reload').addEventListener('touchstart', () => {
            if(!isDead) { ammo = maxAmmo; updateUI(); }
        });

        function updateUI() { document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`; }

        function spawnEnemy() {
            if(isDead) return;
            let side = Math.floor(Math.random() * 4);
            let x, y;
            if(side==0){ x=Math.random()*canvas.width; y=-30; }
            else if(side==1){ x=Math.random()*canvas.width; y=canvas.height+30; }
            else if(side==2){ x=-30; y=Math.random()*canvas.height; }
            else { x=canvas.width+30; y=Math.random()*canvas.height; }
            enemies.push({ x, y, r: 18, s: 1.2 });
        }
        setInterval(spawnEnemy, 1500);

        const questions = [
            { q: "Aşağıdakilerden hangisi İslam'ın şartlarından biri değildir?", a: ["Namaz Kılmak", "Anne babaya iyi davranmak", "Zekat Vermek", "Hacca Gitmek"], c: "Anne babaya iyi davranmak" }
        ];

        function triggerQuiz() {
            isDead = true;
            document.getElementById('quiz').style.display = 'flex';
            const q = questions[0];
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options');
            container.innerHTML = "";
            q.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'q-opt';
                btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === q.c) { isDead = false; document.getElementById('quiz').style.display = 'none'; enemies = []; }
                    else { alert("Yanlış! Sistem hala kilitli."); }
                };
                container.appendChild(btn);
            });
        }

        function gameLoop() {
            drawBackground();

            if(!isDead) {
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;

                // Taramalı Ateş Mantığı
                if(isShooting && ammo > 0) {
                    shootTimer++;
                    if(shootTimer % 6 === 0) { // Her 6 karede bir mermi at (çoklu ateş)
                        bullets.push({ x: player.x, y: player.y, angle: player.angle, s: 10 });
                        ammo--;
                        updateUI();
                    }
                }

                bullets.forEach((b, i) => {
                    b.x += Math.cos(b.angle) * b.s;
                    b.y += Math.sin(b.angle) * b.s;
                    ctx.fillStyle = '#f1c40f';
                    ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
                    if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i, 1);
                });

                enemies.forEach((e, ei) => {
                    let dist = Math.hypot(player.x - e.x, player.y - e.y);
                    e.x += ((player.x - e.x)/dist) * e.s;
                    e.y += ((player.y - e.y)/dist) * e.s;

                    ctx.fillStyle = '#8e44ad'; // Mor düşmanlar
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = 'white'; ctx.stroke();

                    if(dist < player.r + e.r) triggerQuiz();

                    bullets.forEach((b, bi) => {
                        if(Math.hypot(b.x - e.x, b.y - e.y) < e.r) {
                            enemies.splice(ei, 1);
                            bullets.splice(bi, 1);
                        }
                    });
                });

                // Oyuncu Çizimi (Asker Tasarımı)
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                ctx.fillStyle = '#27ae60'; // Asker yeşili
                ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#000'; // Silah namlusu
                ctx.fillRect(15, -4, 20, 8);
                ctx.restore();
            }
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
