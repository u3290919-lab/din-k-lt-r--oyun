<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilgi Muhafızı: 10 Soru Edition</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: sans-serif; background: #2c3e50; touch-action: none; }
        canvas { display: block; }
        #ui { position: absolute; top: 15px; left: 15px; color: #fff; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; pointer-events: none; z-index: 50; border: 2px solid #f1c40f; }
        .stat { font-size: 18px; font-weight: bold; margin-bottom: 5px; }
        .ctrl-btn { position: absolute; border-radius: 50%; border: none; color: white; font-weight: bold; z-index: 60; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 15px rgba(0,0,0,0.5); }
        #joy-base { position: absolute; bottom: 40px; left: 40px; width: 130px; height: 130px; background: rgba(255,255,255,0.1); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
        #joy-stick { position: absolute; width: 60px; height: 60px; background: rgba(255,255,255,0.4); border-radius: 50%; top: 35px; left: 35px; }
        #btn-shoot { bottom: 50px; right: 150px; width: 100px; height: 100px; background: #e74c3c; }
        #btn-reload { bottom: 60px; right: 40px; width: 80px; height: 80px; background: #f1c40f; color: #000; }
        #quiz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; text-align: center; }
        .q-opt { background: #34495e; color: white; border: 2px solid #fff; padding: 15px; margin: 8px; width: 90%; max-width: 450px; border-radius: 10px; font-size: 16px; font-weight: bold; }
        #start-screen { position: absolute; width: 100%; height: 100%; background: #1a1a1a; z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; }
        .start-btn { padding: 20px 60px; font-size: 24px; background: #27ae60; border: none; color: white; border-radius: 15px; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color:#f1c40f">BİLGİ MUHAFIZI v3.0</h1>
        <p>60 Mermi | 10 Farklı Soru | Hızlı Düşmanlar</p>
        <button class="start-btn" onclick="startGame()">OYUNU BAŞLAT</button>
    </div>

    <div id="ui">
        <div class="stat">ŞARJÖR: <span id="ammo">60 / 60</span></div>
        <div class="stat" id="status" style="color:#2ecc71">BÖLGE: GÜVENLİ</div>
    </div>

    <div id="joy-base"><div id="joy-stick"></div></div>
    <button class="ctrl-btn" id="btn-shoot">ATEŞ</button>
    <button class="ctrl-btn" id="btn-reload">DOLDUR</button>

    <div id="quiz">
        <h2 style="color: #f1c40f;">DİKKAT: BİLGİ TESTİ</h2>
        <h3 id="q-text">Soru Yükleniyor...</h3>
        <div id="q-options" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <audio id="bgMusic" loop>
        <source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-15.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let player = { x: canvas.width/2, y: canvas.height/2, r: 22, angle: 0, speed: 2.8 };
        let bullets = [], enemies = [];
        let ammo = 60, maxAmmo = 60, isDead = false, isShooting = false;
        let moveX = 0, moveY = 0, shootTimer = 0;

        const questions = [
            { q: "Aşağıdakilerden hangisi İslam'ın şartlarından biri değildir?", a: ["Namaz Kılmak", "Dürüst Olmak", "Zekat Vermek", "Hacca Gitmek"], c: "Dürüst Olmak" },
            { q: "Peygamber Efendimiz (s.a.v) nerede doğmuştur?", a: ["Medine", "Mekke", "Kudüs", "Şam"], c: "Mekke" },
            { q: "Kuran-ı Kerim'in ilk suresi hangisidir?", a: ["Bakara", "İhlas", "Fatiha", "Yasin"], c: "Fatiha" },
            { q: "Allah'ın birliğine inanmaya ne denir?", a: ["Tevhid", "İhlas", "Tevekkül", "İhsan"], c: "Tevhid" },
            { q: "Müslümanların kıblesi neresidir?", a: ["Mescid-i Aksa", "Kabe", "Medine", "Kudüs"], c: "Kabe" },
            { q: "Kuran-ı Kerim hangi halife zamanında kitap haline getirildi?", a: ["Hz. Ömer", "Hz. Ali", "Hz. Ebu Bekir", "Hz. Osman"], c: "Hz. Ebu Bekir" },
            { q: "Ramazan ayında tutulan oruç İslam'ın kaçıncı şartıdır?", a: ["1", "2", "3", "4"], c: "4" },
            { q: "Peygamberimize ilk vahiy hangi mağarada gelmiştir?", a: ["Sevr", "Hira", "Uhud", "Nur"], c: "Hira" },
            { q: "Dinimize göre zenginlerin yılda bir kez verdiği sadaka?", a: ["Zekat", "Fitre", "Öşür", "Kurban"], c: "Zekat" },
            { q: "Aşağıdakilerden hangisi imanın şartlarından biridir?", a: ["Namaz Kılmak", "Meleklere İnanmak", "Oruç Tutmak", "Kelime-i Şehadet"], c: "Meleklere İnanmak" }
        ];

        function drawBackground() {
            ctx.fillStyle = '#34495e'; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            for(let i=0; i<canvas.width; i+=60) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let j=0; j<canvas.height; j+=60) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width, j); ctx.stroke(); }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('bgMusic').play();
            gameLoop();
        }

        const joyBase = document.getElementById('joy-base');
        const joyStick = document.getElementById('joy-stick');
        joyBase.addEventListener('touchmove', (e) => {
            if(isDead) return;
            const t = e.touches[0]; const r = joyBase.getBoundingClientRect();
            const dx = t.clientX - (r.left + 65); const dy = t.clientY - (r.top + 65);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 50); const angle = Math.atan2(dy, dx);
            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = Math.cos(angle) * (dist / 50); moveY = Math.sin(angle) * (dist / 50);
            player.angle = angle;
        });
        joyBase.addEventListener('touchend', () => { joyStick.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });

        document.getElementById('btn-shoot').addEventListener('touchstart', () => { isShooting = true; });
        document.getElementById('btn-shoot').addEventListener('touchend', () => { isShooting = false; });
        document.getElementById('btn-reload').addEventListener('touchstart', () => { if(!isDead) ammo = maxAmmo; updateUI(); });

        function updateUI() { document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`; }

        function spawnEnemy() {
            if(isDead) return;
            let side = Math.floor(Math.random() * 4);
            let x, y;
            if(side==0){ x=Math.random()*canvas.width; y=-50; }
            else if(side==1){ x=Math.random()*canvas.width; y=canvas.height+50; }
            else if(side==2){ x=-50; y=Math.random()*canvas.height; }
            else { x=canvas.width+50; y=Math.random()*canvas.height; }
            enemies.push({ x, y, r: 35, s: 1.5 }); // Boyut 35, Hız 1.5 (Eski hız)
        }
        setInterval(spawnEnemy, 1500); // Eski çıkış hızı (1.5 saniye)

        function triggerQuiz() {
            isDead = true;
            const quizEl = document.getElementById('quiz');
            quizEl.style.display = 'flex';
            const q = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options');
            container.innerHTML = "";
            q.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'q-opt';
                btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === q.c) { isDead = false; quizEl.style.display = 'none'; enemies = []; }
                    else { alert("Yanlış! Tekrar dene."); }
                };
                container.appendChild(btn);
            });
        }

        function gameLoop() {
            drawBackground();
            if(!isDead) {
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;

                if(isShooting && ammo > 0) {
                    shootTimer++;
                    if(shootTimer % 5 === 0) {
                        bullets.push({ x: player.x, y: player.y, angle: player.angle, s: 12 });
                        ammo--; updateUI();
                    }
                }

                bullets.forEach((b, i) => {
                    b.x += Math.cos(b.angle) * b.s; b.y += Math.sin(b.angle) * b.s;
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(b.x, b.y, 6, 0, Math.PI*2); ctx.fill();
                    if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i, 1);
                });

                enemies.forEach((e, ei) => {
                    let d = Math.hypot(player.x - e.x, player.y - e.y);
                    e.x += ((player.x - e.x)/d) * e.s; e.y += ((player.y - e.y)/d) * e.s;
                    ctx.fillStyle = '#c0392b'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
                    if(d < player.r + e.r) triggerQuiz();
                    bullets.forEach((b, bi) => {
                        if(Math.hypot(b.x - e.x, b.y - e.y) < e.r) { enemies.splice(ei, 1); bullets.splice(bi, 1); }
                    });
                });

                ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
                ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#333'; ctx.fillRect(15, -5, 25, 10); ctx.restore();
            }
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
