<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilgi Muhafızı: Mobil Tam Uyum</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Courier New', Courier, monospace; background: #0a0a1a; touch-action: none; user-select: none; }
        canvas { display: block; }
        
        #ui { position: absolute; top: 10px; left: 10px; color: #fff; background: rgba(10, 10, 30, 0.85); padding: 10px; border-radius: 8px; pointer-events: none; z-index: 50; border: 2px solid #e74c3c; font-size: 14px; }
        .stat { font-weight: bold; margin-bottom: 3px; letter-spacing: 1px; }
        
        /* MOBİL İÇİN DÜĞME KONUMLARI (İÇ İÇE GEÇMEYİ ENGELLER) */
        #joy-base { position: absolute; bottom: 30px; left: 30px; width: 110px; height: 110px; background: rgba(255,255,255,0.05); border-radius: 50%; border: 2px solid rgba(231, 76, 60, 0.4); z-index: 60; }
        #joy-stick { position: absolute; width: 50px; height: 50px; background: rgba(231, 76, 60, 0.6); border-radius: 50%; top: 30px; left: 30px; }
        
        .ctrl-btn { position: absolute; border-radius: 50%; border: none; color: white; font-weight: bold; z-index: 60; display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 20px rgba(0,0,0,0.7); font-family: inherit; }
        #btn-shoot { bottom: 35px; right: 135px; width: 85px; height: 85px; background: #e74c3c; font-size: 15px; }
        #btn-reload { bottom: 42px; right: 35px; width: 70px; height: 70px; background: #f1c40f; color: #000; font-size: 12px; }
        
        #quiz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5, 5, 15, 0.98); color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 200; padding: 20px; text-align: center; border: 4px solid #e74c3c; box-sizing: border-box; }
        .q-opt { background: #1a1a3a; color: white; border: 2px solid #e74c3c; padding: 12px; margin: 6px; width: 95%; max-width: 400px; border-radius: 8px; font-size: 15px; font-weight: bold; font-family: inherit; }
        
        #start-screen { position: absolute; width: 100%; height: 100%; background: #050510; z-index: 300; display: flex; flex-direction: column; justify-content: center; align-items: center; color: white; text-align: center; padding: 15px; box-sizing: border-box; }
        .start-btn { padding: 18px 50px; font-size: 20px; background: #e74c3c; border: none; color: white; border-radius: 5px; font-family: inherit; font-weight: bold; box-shadow: 0 0 20px rgba(231, 76, 60, 0.6); margin-top: 15px; }
        
        #leaderboard { margin-top: 15px; background: rgba(255,255,255,0.05); padding: 10px; border-radius: 5px; width: 260px; border: 1px solid #333; }
        .score-row { display: flex; justify-content: space-between; font-size: 13px; margin: 3px 0; color: #bbb; }
    </style>
</head>
<body>

    <div id="start-screen">
        <h1 style="color:#e74c3c; font-size: 28px; letter-spacing: 2px; text-shadow: 0 0 10px rgba(231,76,60,0.8); margin: 0;">BİLGİ MUHAFIZI</h1>
        <p style="color:#888; font-size: 13px; margin: 5px 0;">Mobil & Ses Uyumlu Final Sürümü</p>
        <button class="start-btn" onclick="startGame()">SAVAŞI BAŞLAT</button>
        
        <div id="leaderboard">
            <h3 style="margin: 0 0 8px 0; color:#f1c40f; font-size: 14px;">🏆 EN YÜKSEK 10 SKOR</h3>
            <div id="leaderboard-rows"></div>
        </div>
    </div>

    <div id="ui">
        <div class="stat">ŞARJÖR: <span id="ammo">60 / 60</span></div>
        <div class="stat">SKOR: <span id="score" style="color:#f1c40f">0</span></div>
    </div>

    <div id="joy-base"><div id="joy-stick"></div></div>
    <button class="ctrl-btn" id="btn-shoot">ATEŞ</button>
    <button class="ctrl-btn" id="btn-reload">ŞARJÖR</button>

    <div id="quiz">
        <h2 style="color: #e74c3c; font-size: 20px; margin: 0 0 10px 0;">SİSTEM KİLİTLENDİ</h2>
        <h3 id="q-text" style="font-size: 16px; margin: 10px 0;">Soru Yükleniyor...</h3>
        <div id="q-options" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://assets.mixkit.co/music/preview/mixkit-tech-house-vibe-130.mp3" type="audio/mpeg">
    </audio>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let player = { x: canvas.width/2, y: canvas.height/2, r: 18, angle: 0, speed: 2.8 };
        let bullets = [], enemies = [];
        let ammo = 60, maxAmmo = 60, isDead = false, isShooting = false;
        let moveX = 0, moveY = 0, shootTimer = 0, score = 0;

        const questions = [
            { q: "Aşağıdakilerden hangisi İslam'ın şartlarından biri değildir?", a: ["Namaz Kılmak", "Dürüst Olmak", "Zekat Vermek", "Hacca Gitmek"], c: "Dürüst Olmak" },
            { q: "Peygamber Efendimiz (s.a.v) nerede doğmuştur?", a: ["Medine", "Mekke", "Kudüs", "Şam"], c: "Mekke" },
            { q: "Kuran-ı Kerim'in ilk suresi hangisidir?", a: ["Bakara", "İhlas", "Fatiha", "Yasin"], c: "Fatiha" },
            { q: "Allah'ın birliğine inanmaya ne denir?", a: ["Tevhid", "İhlas", "Tevekkül", "İhsan"], c: "Tevhid" },
            { q: "Müslümanların kıblesi neresidir?", a: ["Mescid-i Aksa", "Kabe", "Medine", "Kudüs"], c: "Kabe" },
            { q: "Kuran-ı Kerim hangi halife zamanında kitap haline getirildi?", a: ["Hz. Ömer", "Hz. Ali", "Hz. Ebu Bekir", "Hz. Osman"], c: "Hz. Ebu Bekir" },
            { q: "Ramazan ayında tutulan oruç İslam'ın kaçıncı şartıdır?", a: ["1", "2", "3", "4"], c: "4" },
            { q: "Peygamberimize ilk vahiy hangi mağarada gelmiştir?", a: ["Sevr", "Hira", "Uhud", "Nur"], c: "Hira" },
            { q: "Dinimize göre zenginlerin yılda bir kez verdiği sadaka?", a: ["Zekat", "Fitre", "Öşür", "Kurban"], c: "Zekat" },
            { q: "Aşağıdakilerden hangisi imanın şartlarından biridir?", a: ["Namaz Kılmak", "Meleklere İnanmak", "Oruç Tutmak", "Kelime-i Şehadet"], c: "Meleklere İnanmak" }
        ];

        function loadLeaderboard() {
            let scores = JSON.parse(localStorage.getItem('topScores')) || [];
            const container = document.getElementById('leaderboard-rows');
            container.innerHTML = "";
            if(scores.length === 0) {
                container.innerHTML = "<div style='color:#666; font-size:12px;'>Henüz skor yok.</div>";
                return;
            }
            scores.slice(0, 5).forEach((s, idx) => {
                container.innerHTML += `<div class="score-row"><span>${idx+1}. Oyuncu</span><span>${s} Puan</span></div>`;
            });
        }

        function saveScore(finalScore) {
            if(finalScore <= 0) return;
            let scores = JSON.parse(localStorage.getItem('topScores')) || [];
            scores.push(finalScore);
            scores.sort((a, b) => b - a);
            localStorage.setItem('topScores', JSON.stringify(scores));
            loadLeaderboard();
        }

        function drawBackground() {
            ctx.fillStyle = '#0a0a1a'; ctx.fillRect(0,0, canvas.width, canvas.height);
            ctx.strokeStyle = 'rgba(231, 76, 60, 0.08)'; ctx.lineWidth = 1;
            for(let i=0; i<canvas.width; i+=50) { ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i, canvas.height); ctx.stroke(); }
            for(let j=0; j<canvas.height; j+=50) { ctx.beginPath(); ctx.moveTo(0,j); ctx.lineTo(canvas.width, j); ctx.stroke(); }
        }

        function startGame() {
            document.getElementById('start-screen').style.display = 'none';
            
            // Tarayıcı kısıtlamasını aşmak için butona basıldığı an sesi zorla başlatıyoruz
            const music = document.getElementById('bgMusic');
            music.volume = 0.5;
            music.play().catch(error => console.log("Ses oynatılamadı, dokunma bekleniyor:", error));
            
            score = 0; ammo = 60; enemies = []; bullets = []; isDead = false;
            player.x = canvas.width/2; player.y = canvas.height/2;
            updateUI();
            gameLoop();
        }

        // Mobil Uyruklu Joystick Dokunmatik Alanı
        const joyBase = document.getElementById('joy-base');
        const joyStick = document.getElementById('joy-stick');
        joyBase.addEventListener('touchmove', (e) => {
            if(isDead) return;
            const t = e.touches[0]; const r = joyBase.getBoundingClientRect();
            const dx = t.clientX - (r.left + r.width/2); const dy = t.clientY - (r.top + r.height/2);
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 40); const angle = Math.atan2(dy, dx);
            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = Math.cos(angle) * (dist / 40); moveY = Math.sin(angle) * (dist / 40);
            player.angle = angle;
        }, {passive: true});
        
        joyBase.addEventListener('touchend', () => { joyStick.style.transform = 'translate(0,0)'; moveX = 0; moveY = 0; });

        // Ateş Etme Buton Düzeltmesi
        const shootBtn = document.getElementById('btn-shoot');
        shootBtn.addEventListener('touchstart', (e) => { e.preventDefault(); isShooting = true; });
        shootBtn.addEventListener('touchend', (e) => { e.preventDefault(); isShooting = false; });
        
        document.getElementById('btn-reload').addEventListener('touchstart', (e) => { 
            e.preventDefault(); 
            if(!isDead) ammo = maxAmmo; 
            updateUI(); 
        });

        function updateUI() { 
            document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`; 
            document.getElementById('score').innerText = score;
        }

        function spawnEnemy() {
            if(isDead || document.getElementById('start-screen').style.display === 'flex') return;
            let side = Math.floor(Math.random() * 4);
            let x, y;
            if(side==0){ x=Math.random()*canvas.width; y=-40; }
            else if(side==1){ x=Math.random()*canvas.width; y=canvas.height+40; }
            else if(side==2){ x=-40; y=Math.random()*canvas.height; }
            else { x=canvas.width+40; y=Math.random()*canvas.height; }
            enemies.push({ x, y, r: 28, s: 1.5 }); // Telefon ekranı için düşman boyutu biraz optimize edildi (28)
        }
        if(!window.enemyInterval) {
            window.enemyInterval = setInterval(spawnEnemy, 1500);
        }

        function triggerQuiz() {
            isDead = true; isShooting = false;
            moveX = 0; moveY = 0;
            const quizEl = document.getElementById('quiz');
            quizEl.style.display = 'flex';
            const q = questions[Math.floor(Math.random() * questions.length)];
            document.getElementById('q-text').innerText = q.q;
            const container = document.getElementById('q-options');
            container.innerHTML = "";
            
            q.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'q-opt';
                btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === q.c) { 
                        isDead = false; quizEl.style.display = 'none'; enemies = []; bullets = [];
                    } else { 
                        alert(`YANLIŞ CEVAP!\nSkorun: ${score}`);
                        saveScore(score);
                        quizEl.style.display = 'none';
                        document.getElementById('start-screen').style.display = 'flex';
                        loadLeaderboard();
                    }
                };
                container.appendChild(btn);
            });
        }

        function gameLoop() {
            if(document.getElementById('start-screen').style.display === 'flex') return;
            drawBackground();
            
            if(!isDead) {
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;

                // Ekran dışına taşma engeli
                player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
                player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

                if(isShooting && ammo > 0) {
                    shootTimer++;
                    if(shootTimer % 5 === 0) {
                        bullets.push({ x: player.x, y: player.y, angle: player.angle, s: 12 });
                        ammo--; updateUI();
                    }
                }

                bullets.forEach((b, i) => {
                    b.x += Math.cos(b.angle) * b.s; b.y += Math.sin(b.angle) * b.s;
                    ctx.fillStyle = '#f1c40f'; ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI*2); ctx.fill();
                    if(b.x<0 || b.x>canvas.width || b.y<0 || b.y>canvas.height) bullets.splice(i, 1);
                });

                enemies.forEach((e, ei) => {
                    let d = Math.hypot(player.x - e.x, player.y - e.y);
                    e.x += ((player.x - e.x)/d) * e.s; e.y += ((player.y - e.y)/d) * e.s;
                    
                    ctx.fillStyle = '#7a0010'; ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();
                    ctx.strokeStyle = '#e74c3c'; ctx.lineWidth = 2; ctx.stroke();
                    
                    if(d < player.r + e.r) triggerQuiz();
                    
                    bullets.forEach((b, bi) => {
                        if(Math.hypot(b.x - e.x, b.y - e.y) < e.r) { 
                            enemies.splice(ei, 1); bullets.splice(bi, 1); 
                            score += 10; updateUI();
                        }
                    });
                });

                ctx.save(); ctx.translate(player.x, player.y); ctx.rotate(player.angle);
                ctx.fillStyle = '#2ecc71'; ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.fillRect(12, -3, 18, 6); ctx.restore();
            }
            requestAnimationFrame(gameLoop);
        }

        loadLeaderboard();
    </script>
</body>
</html>
