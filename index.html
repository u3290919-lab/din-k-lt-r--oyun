<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FPS Eğitim Projesi</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: sans-serif; user-select: none; touch-action: none; background: #000; }
        #crosshair { position: absolute; top: 50%; left: 50%; width: 10px; height: 10px; background: rgba(255,0,0,0.8); border-radius: 50%; transform: translate(-50%, -50%); pointer-events: none; z-index: 10; border: 1px solid white; }
        
        /* SOL JOYSTICK - DAHA GENİŞ ALAN */
        #joystick-zone { position: absolute; bottom: 30px; left: 30px; width: 150px; height: 150px; background: rgba(255,255,255,0.1); border-radius: 50%; z-index: 20; display: flex; justify-content: center; align-items: center; border: 2px solid rgba(255,255,255,0.3); }
        #joystick-handle { width: 60px; height: 60px; background: rgba(255,255,255,0.5); border-radius: 50%; position: absolute; pointer-events: none; }

        /* BUTONLAR */
        .action-btn { position: absolute; width: 80px; height: 80px; border-radius: 50%; color: white; border: none; font-weight: bold; z-index: 20; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        #shoot-btn { bottom: 40px; right: 130px; background: #e74c3c; font-size: 16px; }
        #aim-btn { bottom: 140px; right: 30px; background: #3498db; }
        #reload-btn { bottom: 40px; right: 30px; background: #f1c40f; color: #000; }
        #suicide-btn { top: 10px; right: 10px; background: rgba(231, 76, 60, 0.7); width: auto; height: auto; padding: 10px 15px; border-radius: 5px; font-size: 14px; }

        #ui-stats { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.7); padding: 15px; border-radius: 10px; z-index: 10; pointer-events: none; }
        #question-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: none; flex-direction: column; justify-content: center; align-items: center; z-index: 100; text-align: center; }
        .q-btn { background: #2c3e50; color: white; border: 1px solid #fff; padding: 15px; margin: 10px; width: 280px; border-radius: 8px; font-size: 18px; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-stats">
        <b style="color:#2ecc71">Canlı Proje Sunumu</b><br>
        Takım: <span id="team-status">5v5</span> | Mermi: <span id="ammo">30/30</span>
    </div>

    <div id="crosshair"></div>
    <div id="joystick-zone"><div id="joystick-handle"></div></div>
    
    <button class="action-btn" id="shoot-btn">ATEŞ</button>
    <button class="action-btn" id="aim-btn">DÜRBÜN</button>
    <button class="action-btn" id="reload-btn">ŞARJÖR</button>
    <button class="action-btn" id="suicide-btn" onclick="playerDied()">Test: Vurul</button>

    <div id="question-overlay">
        <h1 id="timer" style="color:red">30</h1>
        <h2 id="q-text">Soru?</h2>
        <div id="options"></div>
    </div>

    <div id="container"></div>

    <script>
        let scene, camera, renderer, player, moveX = 0, moveZ = 0;
        let isDead = false, currentAmmo = 30;

        function init() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87CEEB); // Açık mavi gökyüzü

            camera = new THREE.PerspectiveCamera(75, window.innerWidth/window.innerHeight, 0.1, 1000);
            player = new THREE.Group();
            player.add(camera);
            player.position.y = 2;
            scene.add(player);

            // GÖRSEL HARİTA (Grid - Kareli Zemin)
            const grid = new THREE.GridHelper(100, 50, 0xffffff, 0x444444);
            scene.add(grid);
            
            const floor = new THREE.Mesh(new THREE.PlaneGeometry(100, 100), new THREE.MeshBasicMaterial({color: 0x2ecc71}));
            floor.rotation.x = -Math.PI/2;
            scene.add(floor);

            // Etrafa birkaç kutu koyalım ki hareket belli olsun
            for(let i=0; i<20; i++) {
                let box = new THREE.Mesh(new THREE.BoxGeometry(2,2,2), new THREE.MeshNormalMaterial());
                box.position.set(Math.random()*40-20, 1, Math.random()*40-20);
                scene.add(box);
            }

            renderer = new THREE.WebGLRenderer({antialias: true});
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.getElementById('container').appendChild(renderer.domElement);
        }

        // JOYSTICK MANTIĞI
        const jZone = document.getElementById('joystick-zone');
        const jHandle = document.getElementById('joystick-handle');
        jZone.addEventListener('touchmove', (e) => {
            if(isDead) return;
            let touch = e.touches[0];
            let rect = jZone.getBoundingClientRect();
            let centerX = rect.left + rect.width/2;
            let centerY = rect.top + rect.height/2;
            let dx = touch.clientX - centerX;
            let dy = touch.clientY - centerY;
            let dist = Math.min(Math.sqrt(dx*dx + dy*dy), 60);
            let angle = Math.atan2(dy, dx);
            
            jHandle.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = Math.cos(angle) * (dist/60);
            moveZ = Math.sin(angle) * (dist/60);
        });
        jZone.addEventListener('touchend', () => { 
            jHandle.style.transform = 'translate(0,0)'; 
            moveX = 0; moveZ = 0; 
        });

        // BAKIŞ AÇISI (SAĞ EKRAN)
        let lastX, lastY;
        window.addEventListener('touchmove', (e) => {
            let t = e.touches[0];
            if(t.clientX > window.innerWidth/2) {
                if(lastX) {
                    player.rotation.y -= (t.clientX - lastX) * 0.005;
                }
                lastX = t.clientX; lastY = t.clientY;
            }
        });
        window.addEventListener('touchend', () => { lastX = null; });

        function animate() {
            requestAnimationFrame(animate);
            if(!isDead) {
                // Kamera yönüne göre yürüme
                let dir = new THREE.Vector3(moveX, 0, moveZ).applyQuaternion(player.quaternion);
                player.position.addScaledVector(dir, 0.2);
            }
            renderer.render(scene, camera);
        }

        // SORU SİSTEMİ
        function playerDied() {
            isDead = true;
            document.getElementById('question-overlay').style.display = 'flex';
            document.getElementById('q-text').innerText = "Kuran-ı Kerim'in en uzun suresi hangisidir?";
            let opts = ["Bakara", "Fatiha", "Yasin"];
            let div = document.getElementById('options');
            div.innerHTML = "";
            opts.forEach(o => {
                div.innerHTML += `<button class="q-btn" onclick="check('${o}')">${o}</button>`;
            });
        }

        function check(ans) {
            if(ans === "Bakara") {
                alert("Doğru! Maça dönüyorsun.");
                isDead = false;
                document.getElementById('question-overlay').style.display = 'none';
            } else {
                alert("Yanlış! Beklemen gerekiyor.");
            }
        }

        init(); animate();
    </script>
</body>
</html>
