<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Bilgi Muhafızı 2D</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #1a1a1a; touch-action: none; }
        canvas { display: block; background: #2c3e50; }
        
        /* Arayüz */
        #ui { position: absolute; top: 10px; left: 10px; color: white; background: rgba(0,0,0,0.6); padding: 10px; border-radius: 8px; pointer-events: none; }
        .stat { font-size: 14px; margin-bottom: 5px; }

        /* Dokunmatik Butonlar */
        .ctrl-btn { position: absolute; border-radius: 50%; border: none; color: white; font-weight: bold; z-index: 10; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 10px rgba(0,0,0,0.4); }
        #joy-base { position: absolute; bottom: 30px; left: 30px; width: 120px; height: 120px; background: rgba(255,255,255,0.15); border-radius: 50%; border: 2px solid rgba(255,255,255,0.3); }
        #joy-stick { position: absolute; width: 50px; height: 50px; background: rgba(255,255,255,0.5); border-radius: 50%; top: 35px; left: 35px; }
        
        #btn-shoot { bottom: 40px; right: 130px; width: 80px; height: 80px; background: #e74c3c; font-size: 14px; }
        #btn-reload { bottom: 40px; right: 30px; width: 70px; height: 70px; background: #f1c40f; color: #000; font-size: 12px; }

        /* Soru Ekranı */
        #quiz { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: #000; color: white; display: none; flex-direction: column; align-items: center; justify-content: center; z-index: 100; padding: 20px; box-sizing: border-box; text-align: center; }
        .q-opt { background: #34495e; color: white; border: 1px solid #fff; padding: 15px; margin: 10px; width: 90%; max-width: 400px; border-radius: 8px; font-size: 18px; }
    </style>
</head>
<body>

    <div id="ui">
        <div class="stat">Mermi: <span id="ammo">10 / 10</span></div>
        <div class="stat">Durum: <span id="status" style="color:#2ecc71">Güvende</span></div>
    </div>

    <div id="joy-base"><div id="joy-stick"></div></div>
    <button class="ctrl-btn" id="btn-shoot">ATEŞ</button>
    <button class="ctrl-btn" id="btn-reload">YENİLE</button>

    <div id="quiz">
        <h2 id="q-timer" style="color: #e74c3c;">30</h2>
        <h3 id="q-text">Soru Yükleniyor...</h3>
        <div id="q-options" style="width:100%; display:flex; flex-direction:column; align-items:center;"></div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // Oyun Değişkenleri
        let player = { x: canvas.width/2, y: canvas.height/2, r: 20, angle: 0, speed: 4 };
        let bullets = [];
        let enemies = [];
        let ammo = 10, maxAmmo = 10, isDead = false;
        let moveX = 0, moveY = 0;

        // Joystick Kontrolü
        const joyBase = document.getElementById('joy-base');
        const joyStick = document.getElementById('joy-stick');
        joyBase.addEventListener('touchmove', (e) => {
            if(isDead) return;
            const touch = e.touches[0];
            const rect = joyBase.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const dx = touch.clientX - centerX;
            const dy = touch.clientY - centerY;
            const dist = Math.min(Math.sqrt(dx*dx + dy*dy), 45);
            const angle = Math.atan2(dy, dx);

            joyStick.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;
            moveX = Math.cos(angle) * (dist / 45);
            moveY = Math.sin(angle) * (dist / 45);
            player.angle = angle; // Karakter hareket yönüne bakar
        });

        joyBase.addEventListener('touchend', () => {
            joyStick.style.transform = 'translate(0,0)';
            moveX = 0; moveY = 0;
        });

        // Ateş Etme
        document.getElementById('btn-shoot').addEventListener('touchstart', () => {
            if(isDead || ammo <= 0) return;
            bullets.push({ x: player.x, y: player.y, angle: player.angle, s: 8 });
            ammo--;
            updateUI();
        });

        // Mermi Yenileme
        document.getElementById('btn-reload').addEventListener('touchstart', () => {
            if(isDead) return;
            ammo = maxAmmo;
            updateUI();
        });

        function updateUI() {
            document.getElementById('ammo').innerText = `${ammo} / ${maxAmmo}`;
        }

        // Düşman Oluşturma
        function spawnEnemy() {
            if(isDead) return;
            let x = Math.random() < 0.5 ? 0 : canvas.width;
            let y = Math.random() * canvas.height;
            enemies.push({ x, y, r: 15, s: 1.5 });
        }
        setInterval(spawnEnemy, 2000);

        // Soru Sistemi
        const questions = [
            { q: "İslam'ın beş şartından biri olan 'Hacca gitmek' kimlere farzdır?", a: ["Her Müslümana", "Zengin ve sağlığı yerinde olanlara", "Sadece yaşlılara"], c: "Zengin ve sağlığı yerinde olanlara" }
        ];

        function triggerQuiz() {
            isDead = true;
            const quizEl = document.getElementById('quiz');
            quizEl.display = 'flex'; // Block yerine flex kullanıyoruz
            quizEl.style.display = 'flex';
            
            const q = questions[0];
            document.getElementById('q-text').innerText = q.q;
            const optContainer = document.getElementById('q-options');
            optContainer.innerHTML = "";
            q.a.forEach(opt => {
                const btn = document.createElement('button');
                btn.className = 'q-opt';
                btn.innerText = opt;
                btn.onclick = () => {
                    if(opt === q.c) {
                        alert("Doğru! Devam et.");
                        isDead = false;
                        quizEl.style.display = 'none';
                        enemies = [];
                    } else {
                        alert("Yanlış cevap! Biraz bekle.");
                    }
                };
                optContainer.appendChild(btn);
            });
        }

        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            if(!isDead) {
                // Hareket
                player.x += moveX * player.speed;
                player.y += moveY * player.speed;

                // Sınır Kontrolü
                player.x = Math.max(player.r, Math.min(canvas.width - player.r, player.x));
                player.y = Math.max(player.r, Math.min(canvas.height - player.r, player.y));

                // Mermiler
                bullets.forEach((b, index) => {
                    b.x += Math.cos(b.angle) * b.s;
                    b.y += Math.sin(b.angle) * b.s;
                    ctx.fillStyle = 'yellow';
                    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
                    if(b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) bullets.splice(index, 1);
                });

                // Düşmanlar
                enemies.forEach((e, ei) => {
                    let dx = player.x - e.x;
                    let dy = player.y - e.y;
                    let dist = Math.sqrt(dx*dx + dy*dy);
                    e.x += (dx/dist) * e.s;
                    e.y += (dy/dist) * e.s;

                    ctx.fillStyle = '#e74c3c';
                    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI*2); ctx.fill();

                    // Vurulma Kontrolü (Oyuncu düşmana çarparsa)
                    if(dist < player.r + e.r) {
                        triggerQuiz();
                    }

                    // Düşmanın vurulması
                    bullets.forEach((b, bi) => {
                        let bdx = b.x - e.x;
                        let bdy = b.y - e.y;
                        let bdist = Math.sqrt(bdx*bdx + bdy*bdy);
                        if(bdist < e.r) {
                            enemies.splice(ei, 1);
                            bullets.splice(bi, 1);
                        }
                    });
                });

                // Oyuncuyu Çiz
                ctx.save();
                ctx.translate(player.x, player.y);
                ctx.rotate(player.angle);
                ctx.fillStyle = '#2ecc71';
                ctx.beginPath(); ctx.arc(0, 0, player.r, 0, Math.PI*2); ctx.fill();
                ctx.fillStyle = 'white'; // Göz/Yön belirteci
                ctx.fillRect(10, -5, 15, 10);
                ctx.restore();
            }

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
